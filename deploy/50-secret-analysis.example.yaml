# The Secret the analysis Job's environment comes from — `config.analysis.job.secret_ref`.
#
# An example, with no values in it: the real one is created out of band (SOPS, the
# External Secrets operator, or `kubectl create secret generic` from a password
# manager) and never committed. Four keys, and the reason each is here:
#
#   TRIAGE_GITHUB_TOKEN     read-only, repos and commits; the Job clones, never pushes
#   TRIAGE_DATABASE_URL     the insert-only role from postgres/analysis-writer-role.sql,
#                           not Triage's own credentials
#   TRIAGE_LITELLM_URL      the in-cluster proxy, which is where the tier aliases and
#                           the spend caps live (ADR-0007)
#   TRIAGE_LITELLM_API_KEY  the proxy's key, not an Anthropic key: the sandbox never
#                           holds the provider credential
apiVersion: v1
kind: Secret
metadata:
  name: triage-analysis
  namespace: triage
  labels:
    app.kubernetes.io/part-of: triage
    app.kubernetes.io/component: analysis
type: Opaque
stringData:
  TRIAGE_GITHUB_TOKEN: ""
  TRIAGE_DATABASE_URL: "postgresql+psycopg://triage_analysis:CHANGEME@postgresql.triage.svc:5432/triage"
  TRIAGE_LITELLM_URL: "http://litellm.triage.svc:4000/v1"
  TRIAGE_LITELLM_API_KEY: ""
