# The sandbox's egress. Default-deny, then four destinations (architecture §7).
#
# This selects only the analysis Job — `app.kubernetes.io/component: analysis`, a
# label `triage.analysis.jobs.job_manifest` puts on every Job it submits — because
# the rest of the namespace legitimately talks to Datadog, Slack and Jira and the
# Job may talk to none of them.
#
# What it does need, and the plan's "GitHub and the registry only" is not quite
# the list:
#
#   * DNS, or nothing resolves.
#   * GitHub, to clone the tree at the commit. Named as CIDRs because a
#     NetworkPolicy cannot resolve a hostname; the ranges below are GitHub's own
#     `git` and `api` blocks from https://api.github.com/meta, IPv4 only, read on
#     2026-08-24. They move. Refresh with:
#       curl -s https://api.github.com/meta | jq -r '(.git + .api)[] | select(test(":") | not)'
#     If the cluster runs Cilium, replace that rule with a `toFQDNs` rule for
#     github.com and codeload.github.com and the list stops rotting.
#   * The LiteLLM proxy, in-cluster, because the analysis is one `analysis`-tier
#     call (ADR-0014).
#   * PostgreSQL, in-cluster, because the Job's only way to answer is one row in
#     `triage.analysis_results` (ADR-0009), written as the insert-only role in
#     deploy/postgres/analysis-writer-role.sql. If the database is RDS rather than
#     in-cluster, replace that podSelector with the subnet's CIDR.
#
# The registry is *not* in this list: image pulls are the kubelet's traffic, not
# the Pod's, and no NetworkPolicy governs them. The node's egress to the registry
# belongs to platform-infra.
#
# Nothing else is allowed. Egress to 169.254.169.254 is refused along with
# everything else, which is what stops a clone that runs code from reading the
# node's instance credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: triage-analysis-egress
  namespace: triage
  labels:
    app.kubernetes.io/part-of: triage
    app.kubernetes.io/component: analysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: triage
      app.kubernetes.io/component: analysis
  policyTypes:
    - Ingress
    - Egress
  # No ingress at all: nothing has any reason to reach into an analysis.
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 4.208.26.197/32
        - ipBlock:
            cidr: 4.208.26.198/32
