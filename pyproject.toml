[project]
name = "triage"
version = "0.1.0"
description = "Turns a production signal into a ticket a developer can act on without further investigation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0.2",
    # `sqlalchemy[asyncio]`, not bare sqlalchemy: the async session needs greenlet, and
    # without it every write through SqlRepository fails at commit rather than at import.
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "slack-sdk>=3.34",
    "httpx>=0.28",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "PT"]
# UP040: PEP 695 `type` aliases are lazily evaluated and Pydantic's handling of
# Annotated inside them is version-sensitive; explicit TypeAlias stays.
# UP047: same reason one step along — a PEP 695 type parameter on a function that
# is generic over a Protocol reads no better and drags in the same lazy scoping.
ignore = ["ANN401", "UP040", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"evals/**" = ["ANN"]
"scripts/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["triage"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
