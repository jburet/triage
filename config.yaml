# Static configuration, versioned. Discovered data (the system map) lives in
# PostgreSQL and is never hand-edited here.

# Which systems this deployment may write to (ADR-0023). `slack` is the first
# release: the Jira client, the composer and the self-review stay in the tree and
# stay tested, and no run calls them. `slack_and_jira` puts the ticket path back,
# which is the whole reason the decision is a line of configuration rather than a
# deletion — revisit it when someone asks to keep a report.
writes: slack

# An alert is matched to a team by pattern, never by enumeration: the firing
# groups are per-customer tenants and a list here would be obsolete the day a
# customer is provisioned (ADR-0017).
teams:
  - name: platform
    slack_channel: "#platform-alerts"
    jira_project: ZEE
    service_patterns: ["plt-*"]
    namespace_patterns: ["*"]
    environments: [prod]

# Datadog kube_cluster_name -> environment. No alert carries a usable env: tag —
# for Kubernetes monitors the environment is inside the cluster name, and for the
# others it is inside the monitor's own name — so this map is not a convenience,
# it is the only thing that works (ADR-0017). An unmapped cluster is out of
# scope with that reason, never assumed to be production.
clusters:
  prod-use1: prod
  prod-euw3: prod
  preprod-euw3: preprod

repos:
  - url: github.com/zeenea/datacatalog
    team: platform
    kind: application
    # The image and the seed both call this repository `platform`; the remote does
    # not. Without this the derivation resolves the workload and then loses its
    # commit, because no declared repository answers to the name the image gave.
    image_name: platform
    # `serves` names the service patterns this repository is deployed as. The
    # system map is keyed on the name a repository says it deploys as, so a
    # multi-tenant platform — one instance per customer, plt-merck-qa,
    # plt-hcl-software-uat — needs this or every one of its alerts resolves to
    # "not in the system map" and nothing is ever read.
    serves: ["plt-*"]
    # An image tag is a build number and a git tag of the same name is what
    # resolves it to a commit. Where the two are spelled differently, say how —
    # `v{tag}`, `build-{tag}` — because only the declared spelling is looked up.
    # tag_template: "v{tag}"
  - url: github.com/zeenea/platform-infra
    team: platform
    kind: terraform
    # Which paths define which workload. This repository organises by what it
    # provisions on, so no directory is named `platform`: the StatefulSet and its
    # probe timeouts are `resource "kubernetes_stateful_set_v1" "platform"` inside
    # terraform/eks_module/eks.tf, a name one level below any path (ADR-0021).
    defines:
      platform: ["terraform/eks_module/*"]

# Target databases for F3. Credentials are never inlined: `secret_ref` names a
# Kubernetes Secret exposing a read-only role (see ADR-0008).
databases: []
#  - name: payments-primary
#    team: payments
#    secret_ref: triage-db-payments-primary

thresholds:
  # Minimum diagnosis confidence for a signal to become a Jira ticket (ADR-0002).
  # F3 is proactive and noisier than F1, so it earns a higher bar.
  ticket_confidence:
    F1: medium
    F3: high

  # Re-alert Slack on an updated (deduplicated) ticket at this occurrence count,
  # then every `dedup_recurrence_interval` occurrences after it (ADR-0003).
  dedup_recurrence_alert: 3
  dedup_recurrence_interval: 5

  # compose -> self_review retry budget. On exhaustion: Slack notice with the
  # draft attached, no Jira ticket.
  max_compose_attempts: 3

  # An alert is analysed only once it has been firing this long (ADR-0018).
  # Across 961 measured pod-down cycles the longest was nine minutes; the gate
  # discards precisely what a human would not have ticketed either. Flapping is
  # counted rather than discarded, because the reference incident — a liveness
  # probe shorter than the pod's own startup — has exactly that signature.
  alert_persistence_minutes: 15
  p1_alert_persistence_minutes: 5
  flap_count: 5
  flap_window_hours: 24

analysis:
  # Secondary-cause fan-out in the Analysis sub-graph (ADR-0005).
  min_rank_score: 0.3
  max_hypotheses: 3

  # Where one analysis runs (ADR-0009). The runtime class, the Secret, the
  # NetworkPolicy and the narrow database role are created by the infra track;
  # Triage only names them when it submits the Job.
  job:
    namespace: triage
    image: ""
    runtime_class: gvisor
    secret_ref: triage-analysis

# Caps on one F1 collection (ADR-0016). Reduction happens before the model, not
# in the prompt: the reference incident's sixty log entries were 176 KB on the
# wire, of which 45 lines were the same message.
collection:
  window_multiplier: 4          # of the monitor's own evaluation window
  window_min_minutes: 15
  window_max_hours: 6
  widen_days: 7                 # how far back an empty collector is re-checked
  max_followup_calls: 6
  max_log_templates: 15
  max_log_lines: 25
  max_events: 40
  max_timeseries_series: 6
  max_timeseries_points: 60
  max_prompt_bytes: 60000
